<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar Akun — BELANJAKU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">
<div id="site-header"></div>
<main class="wrap" id="app">

<div class="box auth-box form"><h1>Buat Akun Baru</h1><p style="color:var(--mu);font-size:.88rem">Sudah punya akun? <a href="login.html" style="color:var(--g);font-weight:600">Masuk</a></p>
<form id="authForm"><label for="nama">Nama Lengkap</label><input class="fld" id="nama" required><label for="email">Email</label><input class="fld" id="email" type="email" required>
<label for="pw">Kata Sandi</label><input class="fld" id="pw" type="password" required><label for="pw2">Ulangi Kata Sandi</label><input class="fld" id="pw2" type="password" required>
<button class="btn btn-primary btn-block" style="margin-top:18px">Daftar</button><p class="msg" id="msg"></p></form></div>
</main>
<div id="site-footer"></div>
<div class="toast" id="toast" role="status"></div>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
